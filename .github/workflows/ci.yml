name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.x"
  OTP_VERSION: "28.x"

jobs:
  quality:
    name: Quality (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.x"
            otp: "28.x"
            test_args: ""
          - elixir: "1.20.x"
            otp: "29.x"
            test_args: "--cover"
    env:
      MIX_ENV: test
      MIX_BUILD_PATH: _build/quality
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Rust for test-only native dependencies
        uses: dtolnay/rust-toolchain@stable

      - name: Restore quality build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/quality
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-quality-${{ hashFiles('mix.lock') }}

      - name: Restore real embedding model cache
        uses: actions/cache@v6
        with:
          path: .fastembed_cache
          key: ${{ runner.os }}-fastembed-models-${{ hashFiles('mix.lock', 'test/support/semantic_cache_customer_support.ex') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      # The ordinary suite includes real ExFastembed/Vettore and the >=60s
      # complete-agent lifecycle. No duplicate checkout or opt-in test lane.
      - name: Run all tests, including real embeddings and agent endurance
        run: mix test --warnings-as-errors ${{ matrix.test_args }}

      - name: Upload coverage even when its threshold fails
        if: ${{ always() && matrix.test_args == '--cover' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover
          if-no-files-found: warn

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Dialyzer PLT and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-dialyzer-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  performance:
    name: Governed runtime benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: dev
      MIX_BUILD_PATH: _build/performance
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.x"
          otp-version: "29.x"

      - name: Restore performance build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/performance
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-performance-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      # Measurements, not a throughput SLO on shared GitHub runners.
      - name: Measure latency, ledger growth and process memory
        run: mix run bench/suite.exs --quick --output "$RUNNER_TEMP/spectre-bench"

      - name: Upload benchmark measurements
        uses: actions/upload-artifact@v7
        with:
          name: governed-runtime-bench
          path: ${{ runner.temp }}/spectre-bench
          if-no-files-found: error

  package:
    name: Package dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore package build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-package-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Build HexDocs without warnings
        run: |
          mix docs --warnings-as-errors
          mix run scripts/check_documentation_links.exs doc

      - name: Validate package locally (no publish)
        run: mix hex.build --unpack --output "$RUNNER_TEMP/hex-package"

      - name: Verify packaged runtime and documentation contracts
        run: mix run scripts/check_package.exs "$RUNNER_TEMP/hex-package"

      - name: Prove production isolation in a fresh build directory
        env:
          MIX_ENV: prod
          MIX_BUILD_PATH: ${{ runner.temp }}/spectre-prod
        run: |
          mix compile --warnings-as-errors
          mix run --no-start scripts/check_optional_runtime.exs
