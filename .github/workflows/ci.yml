name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.x"
  OTP_VERSION: "28.x"

jobs:
  quality:
    name: Quality (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19.x"
            otp: "28.x"
            test_args: ""
          - elixir: "1.20.x"
            otp: "29.x"
            test_args: "--cover"
    env:
      MIX_ENV: test
      MIX_BUILD_PATH: _build/quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore quality build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/quality
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-quality-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test ${{ matrix.test_args }}

      - name: Run Credo
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Dialyzer PLT and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-dialyzer-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  package:
    name: Package dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore package build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-package-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Build HexDocs without warnings
        run: mix docs --warnings-as-errors

      - name: Validate package locally (no publish)
        run: mix hex.build --unpack --output "$RUNNER_TEMP/hex-package"

      - name: Verify packaged generator contracts
        run: |
          test -f "$RUNNER_TEMP/hex-package/priv/templates/spectre.gen.agent/agent.ex.eex"
          test -f "$RUNNER_TEMP/hex-package/priv/templates/spectre.gen.agent/agent_test.exs.eex"
          test -f "$RUNNER_TEMP/hex-package/priv/templates/spectre.gen.installable/installable.ex.eex"
          test -f "$RUNNER_TEMP/hex-package/priv/templates/spectre.gen.installable/installable_test.exs.eex"
          test -f "$RUNNER_TEMP/hex-package/priv/templates/spectre.gen.checkpoint_store/checkpoint_store.ex.eex"
          test -f "$RUNNER_TEMP/hex-package/priv/templates/spectre.gen.checkpoint_store/checkpoint_store_test.exs.eex"

  real-ex-fastembed:
    name: Real ExFastembed system test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      SPECTRE_EX_FASTEMBED_PATH: ${{ github.workspace }}/ex_fastembed
      SPECTRE_REAL_EMBEDDING_TESTS: "1"
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
    steps:
      - name: Check out Spectre
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out ExFastembed
        uses: actions/checkout@v6
        with:
          repository: elchemista/ex_fastembed
          ref: 02edfc604274077d8a02848dcfafd56797598d77
          path: ex_fastembed
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore native build and model caches
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/test
            .fastembed_cache
            ex_fastembed/priv/native
            ex_fastembed/native/ex_fastembed/target
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-real-fastembed-v2-${{ hashFiles('mix.real_embeddings.lock', 'ex_fastembed/mix.lock', 'ex_fastembed/native/ex_fastembed/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run real embedding lifecycle test
        run: mix test test/real_ex_fastembed_semantic_cache_test.exs --include real_ex_fastembed
